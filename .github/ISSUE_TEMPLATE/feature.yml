name: Feature or refactor request
description: Propose new behavior or a scoped structural improvement
title: "[Feature]: "
labels:
  - needs-spec
body:
  - type: markdown
    attributes:
      value: |
        Describe the user outcome before proposing implementation details. Do not include credentials, private data, or secrets.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Who benefits, and what limitation or need should be addressed?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable behavior after completion.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Proposed acceptance criteria
      description: List testable user-visible or structural outcomes.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Existing ... behavior remains unchanged.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Explicitly state adjacent work that is outside this request.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and compatibility
      description: Note platform, accessibility, storage, dependency, performance, or migration constraints.

  - type: textarea
    id: validation
    attributes:
      label: Required validation
      description: Identify important automated, regression, manual, or visual scenarios.

  - type: textarea
    id: context
    attributes:
      label: Supporting context
      description: Add sanitized screenshots, mockups, examples, or related Issues.
